
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة - مدرسة الضياء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-pink-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- شاشة تسجيل دخول الإدارة -->
        <div id="adminAuthView" class="bg-white p-8 rounded-2xl shadow-sm border border-pink-100 max-w-md mx-auto space-y-4">
            <h2 class="text-xl font-bold text-pink-700 text-center">🔒 دخول لوحة إدارة المدرسة</h2>
            <div>
                <label class="block text-xs font-semibold mb-1">اسم المستخدم:</label>
                <input type="text" id="adminUserInput" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">كلمة المرور:</label>
                <input type="password" id="adminPassInput" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="123456">
            </div>
            <button onclick="loginAdmin()" class="w-full bg-pink-600 text-white py-2 rounded-lg font-semibold hover:bg-pink-700 text-sm">دخول اللوحة</button>
        </div>

        <!-- لوحة الإدارة (تظهر فقط بعد إدخال كلمة المرور الصحيحة) -->
        <div id="adminDashboardView" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-pink-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-pink-800">إدارة مدرسة الضياء للبنات - لوحة التحكم المركزية</h2>
                <button onclick="logoutAdmin()" class="bg-gray-600 text-white px-3 py-1 rounded text-xs">خروج الإدارة</button>
            </div>

            <!-- طلبات أولياء الأمور المعلقة -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-pink-100 space-y-4">
                <h2 class="text-base font-bold text-pink-700 border-b pb-2">📋 طلبات الدخول المعلقة لأولياء الأمور</h2>
                <div id="requestsContainer" class="space-y-3"><p class="text-gray-500 text-sm">لا توجد طلبات معلقة حالياً.</p></div>
            </div>

            <!-- استفسارات أولياء الأمور الواردة -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-pink-100 space-y-4">
                <h2 class="text-base font-bold text-blue-700 border-b pb-2">💬 أسئلة واستفسارات أولياء الأمور (الرد المباشر)</h2>
                <div id="adminInquiriesContainer" class="space-y-3"><p class="text-gray-500 text-sm">لا توجد استفسارات جديدة حالياً.</p></div>
            </div>

            <!-- التنبيهات الموجهة لكل صف وشعبة -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-purple-200 space-y-4">
                <h2 class="text-base font-bold text-purple-700 border-b pb-2">📢 إرسال توجيه أو تنبيه لصف وشعبة محددة</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold mb-1">الصف المستهدف:</label>
                        <select id="targetGrade" class="w-full px-3 py-2 border rounded-lg bg-white text-xs">
                            <option value="الكل">جميع الصفوف</option>
                            <option value="الأول الابتدائي">الأول الابتدائي</option>
                            <option value="الثاني الابتدائي">الثاني الابتدائي</option>
                            <option value="الثالث الابتدائي">الثالث الابتدائي</option>
                            <option value="الرابع الابتدائي">الرابع الابتدائي</option>
                            <option value="الخامس الابتدائي">الخامس الابتدائي</option>
                            <option value="السادس الابتدائي">السادس الابتدائي</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">الشعبة المستهدفة:</label>
                        <select id="targetSection" class="w-full px-3 py-2 border rounded-lg bg-white text-xs">
                            <option value="الكل">جميع الشعب</option>
                            <option value="أ">الشعبة (أ)</option>
                            <option value="ب">الشعبة (ب)</option>
                            <option value="ج">الشعبة (ج)</option>
                        </select>
                    </div>
                </div>
                <input type="text" id="targetTitle" class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="عنوان التنبيه">
                <textarea id="targetBody" rows="2" class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="اكتب نص التنبيه أو دروس اليوم..."></textarea>
                <button onclick="sendTargetedBroadcast()" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-purple-700">إرسال التوجيه</button>
            </div>
        </div>

    </div>

    <script>
        let adminUser = localStorage.getItem('school_admin_user') || 'admin';
        let adminPass = localStorage.getItem('school_admin_pass') || '123456';

        let pendingRequests = JSON.parse(localStorage.getItem('school_pending')) || [];
        let approvedStudents = JSON.parse(localStorage.getItem('school_approved')) || [];
        let parentInquiries = JSON.parse(localStorage.getItem('school_inquiries')) || [];

        function loginAdmin() {
            const u = document.getElementById('adminUserInput').value.trim();
            const p = document.getElementById('adminPassInput').value.trim();
            if (u === adminUser && p === adminPass) {
                document.getElementById('adminAuthView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                renderRequests();
                renderAdminInquiries();
            } else {
                alert("❌ بيانات الدخول غير صحيحة!");
            }
        }

        function logoutAdmin() {
            document.getElementById('adminDashboardView').classList.add('hidden');
            document.getElementById('adminAuthView').classList.remove('hidden');
        }

        function saveData() {
            localStorage.setItem('school_pending', JSON.stringify(pendingRequests));
            localStorage.setItem('school_approved', JSON.stringify(approvedStudents));
            localStorage.setItem('school_inquiries', JSON.stringify(parentInquiries));
        }

        function renderRequests() {
            const container = document.getElementById('requestsContainer');
            if (pendingRequests.length === 0) { container.innerHTML = `<p class="text-gray-500 text-sm">لا توجد طلبات معلقة حالياً.</p>`; return; }
            container.innerHTML = '';
            pendingRequests.forEach((req, index) => {
                container.innerHTML += `
                    <div class="p-3 bg-pink-50 border rounded-lg flex justify-between items-center text-sm">
                        <div><p class="font-bold text-pink-900">الطّالبة: ${req.student}</p><p class="text-xs text-gray-600">الأم: ${req.mother} | ${req.grade} - شعبة (${req.section})</p></div>
                        <button onclick="approveStudent(${index})" class="bg-green-600 text-white px-3 py-1 rounded text-xs">✓ موافقة</button>
                    </div>`;
            });
        }

        function approveStudent(index) {
            const student = pendingRequests.splice(index, 1)[0];
            student.notifications = [{ type: 'text', title: "حالة الدخول", body: "✓ تمت الموافقة على دخولك المنصة." }];
            approvedStudents.push(student);
            saveData();
            alert(`تمت الموافقة على دخول الطّالبة (${student.student}).`);
            renderRequests();
        }

        function renderAdminInquiries() {
            const container = document.getElementById('adminInquiriesContainer');
            if (parentInquiries.length === 0) { container.innerHTML = `<p class="text-gray-500 text-sm">لا توجد استفسارات جديدة.</p>`; return; }
            container.innerHTML = '';
            parentInquiries.forEach((q) => {
                container.innerHTML += `
                    <div class="p-3 bg-blue-50 border rounded-lg space-y-2 text-xs">
                        <p class="font-bold text-blue-900">👧 الطّالبة: ${q.studentName} (${q.grade} - شعبة ${q.section})</p>
                        <p class="bg-white p-2 rounded border"><strong>الرسالة:</strong> ${q.content}</p>
                        <div class="flex gap-2">
                            <input type="text" id="reply_${q.id}" class="flex-1 p-1 border rounded text-xs" placeholder="اكتب الرد هنا...">
                            <button onclick="replyInquiry(${q.id})" class="bg-blue-600 text-white px-3 py-1 rounded">إرسال الرد</button>
                        </div>
                    </div>`;
            });
        }

        function replyInquiry(id) {
            const replyText = document.getElementById(`reply_${id}`).value.trim();
            if (!replyText) return;
            const idx = parentInquiries.findIndex(q => q.id === id);
            if (idx !== -1) {
                const inquiry = parentInquiries[idx];
                const student = approvedStudents.find(s => s.id === inquiry.studentId);
                if (student) {
                    student.notifications.unshift({ type: 'text', title: `💬 رد الإدارة`, body: replyText });
                    parentInquiries.splice(idx, 1);
                    saveData();
                    alert("✓ تم إرسال الرد لولي الأمر.");
                    renderAdminInquiries();
                }
            }
        }

        function sendTargetedBroadcast() {
            const grade = document.getElementById('targetGrade').value;
            const section = document.getElementById('targetSection').value;
            const title = document.getElementById('targetTitle').value.trim();
            const body = document.getElementById('targetBody').value.trim();

            if (!title || !body) { alert("الرجاء تعبئة العنوان والنص."); return; }

            approvedStudents.forEach(st => {
                if ((grade === 'الكل' || st.grade === grade) && (section === 'الكل' || st.section === section)) {
                    st.notifications.unshift({ type: 'text', title: `📢 ${title}`, body: body });
                }
            });
            saveData();
            alert("✓ تم إرسال التنبيه للشعبة المحددة بنجاح.");
        }
    </script>
</body>
</html>
