<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - منصة المدرسة</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .whatsapp-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn-whatsapp:hover {
            background: #1ebe5d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم إدارة المدرسة</h2>
    <p style="text-align: center; color: #777;">مرحباً بك، يمكنك من هنا إدارة المنصة وإرسال الإشعارات والتواصل المباشر.</p>

    <!-- قسم إرسال رسائل الواتساب لأولياء الأمور -->
    <div class="whatsapp-section">
        <h3 style="margin-top: 0; color: #333;">إرسال رسالة واتساب لولي الأمر</h3>
        
        <div class="form-group">
            <label for="studentName">اسم الطالب:</label>
            <input type="text" id="studentName" placeholder="أدخل اسم الطالب هنا">
        </div>

        <div class="form-group">
            <label for="parentPhone">رقم هاتف ولي الأمر (مع رمز الدولة):</label>
            <input type="text" id="parentPhone" placeholder="مثال: 9647800000000">
        </div>

        <div class="form-group">
            <label for="msgText">نص الرسالة:</label>
            <textarea id="msgText" placeholder="اكتب الرسالة المراد إرسالها (مثل: تنبيه بخصوص الحضور أو الجداول)..."></textarea>
        </div>

        <button class="btn-whatsapp" onclick="sendWhatsApp()">
            إرسال عبر واتساب 📱
        </button>
    </div>
</div>

<script>
    function sendWhatsApp() {
        const name = document.getElementById('studentName').value.trim();
        const phone = document.getElementById('parentPhone').value.trim();
        const text = document.getElementById('msgText').value.trim();

        if (!phone) {
            alert("الرجاء إدخال رقم الهاتف بشكل صحيح");
            return;
        }

        // تنسيق الرسالة بشكل احترافي
        const fullMessage = `عزيزي ولي أمر الطالب (${name || 'المحترم'}):\n\n${text}`;
        const encodedMessage = encodeURIComponent(fullMessage);
        
        // فتح رابط الواتساب المباشر بالرقم والنص
        const whatsappURL = `https://wa.me/${phone}?text=${encodedMessage}`;
        window.open(whatsappURL, '_blank');
    }
</script>

</body>
</html>
