<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم والإدارة - مدرسة الضياء</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex items-center justify-center">

<div class="max-w-xl w-full mx-auto space-y-5">

<!-- شاشة تسجيل الدخول الموحد -->
<div id="authView" class="bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-gray-200 space-y-4">
<h2 class="text-xl font-bold text-indigo-700 text-center">🔐 تسجيل الدخول الموحد</h2>
<p class="text-xs text-gray-500 text-center">أدخل كلمة المرور الخاصة بك (الإدارة أو الكادر التعليمي).</p>
<div>
<label class="block text-xs font-semibold mb-1">كلمة المرور:</label>
<input id="passInput" type="password" class="w-full px-3 py-2 border rounded-lg bg-white text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="أدخل كلمة المرور">
</div>
<button onclick="loginUser()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-xs hover:bg-indigo-700 transition cursor-pointer">دخول النظام 🚀</button>
<p id="loginError" class="text-red-600 text-xs text-center font-semibold"></p>
</div>

<!-- لوحة التحكم الإدارية الكاملة -->
<div id="adminDashboardView" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-gray-200 space-y-5">
<div class="flex justify-between items-center border-b pb-3">
<div>
<h2 class="font-bold text-indigo-700 text-sm sm:text-base">🛠️ لوحة التحكم الإدارية - مدرسة الضياء</h2>
<p class="text-[11px] text-gray-500">صلاحيات كاملة لإدارة المنصة</p>
</div>
<button onclick="logoutUser()" class="bg-gray-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-gray-700 transition cursor-pointer">خروج 🚪</button>
</div>

<div class="space-y-4 text-xs">
<h3 class="font-bold text-gray-700 text-sm border-r-4 border-indigo-600 pr-2">📚 نشر درس إداري جديد</h3>
<div>
<label class="block font-semibold mb-1">المادة الدراسية:</label>
<select id="adminLessonSubject" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500">
<option>القرآن الكريم</option>
<option>اللغة العربية</option>
<option>الرياضيات</option>
<option>الاجتماعيات</option>
<option>اللغة الإنجليزية</option>
<option>الأخلاقية</option>
<option>العلوم</option>
</select>
</div>

<div>
<label class="block font-semibold mb-1">الصف الدراسي:</label>
<select id="adminLessonGrade" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500">
<option>الأول الابتدائي</option>
<option>الثاني الابتدائي</option>
<option>الثالث الابتدائي</option>
<option>الرابع الابتدائي</option>
<option>الخامس الابتدائي</option>
<option>السادس الابتدائي</option>
</select>
</div>

<div>
<label class="block font-semibold mb-1">الشعب المستهدفة:</label>
<div class="flex flex-wrap gap-4 p-3 border rounded-lg bg-indigo-50/50">
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="adminSection" value="أ" class="w-4 h-4 text-indigo-600 rounded"> الشعبة (أ)</label>
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="adminSection" value="ب" class="w-4 h-4 text-indigo-600 rounded"> الشعبة (ب)</label>
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="adminSection" value="ج" class="w-4 h-4 text-indigo-600 rounded"> الشعبة (ج)</label>
</div>
</div>

<div>
<label class="block font-semibold mb-1">تفاصيل الدرس أو الواجب:</label>
<textarea id="adminLessonContent" rows="3" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500" placeholder="اكتبي التفاصيل..."></textarea>
</div>

<button id="adminPublishBtn" onclick="adminSendLesson()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-indigo-700 transition cursor-pointer shadow-sm">
نشر الدرس للشعب المحددة 🚀
</button>
</div>
</div>

<!-- واجهة المعلمات المخصصة -->
<div id="teacherDashboardView" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-pink-200 space-y-4">
<div class="flex justify-between items-center border-b pb-3">
<div>
<h2 class="font-bold text-pink-700 text-sm sm:text-base">👩‍🏫 بوابة المعلمات - نشر الدروس</h2>
<p class="text-[11px] text-gray-500">مخصصة لنشر الحصص والواجبات فقط</p>
</div>
<button onclick="logoutUser()" class="bg-gray-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-gray-700 transition cursor-pointer">خروج 🚪</button>
</div>

<div class="space-y-4 text-xs">
<div>
<label class="block font-semibold mb-1">المادة الدراسية:</label>
<select id="teacherLessonSubject" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-pink-500">
<option>القرآن الكريم</option>
<option>اللغة العربية</option>
<option>الرياضيات</option>
<option>الاجتماعيات</option>
<option>اللغة الإنجليزية</option>
<option>الأخلاقية</option>
<option>العلوم</option>
</select>
</div>

<div>
<label class="block font-semibold mb-1">الصف الدراسي:</label>
<select id="teacherLessonGrade" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-pink-500">
<option>الأول الابتدائي</option>
<option>الثاني الابتدائي</option>
<option>الثالث الابتدائي</option>
<option>الرابع الابتدائي</option>
<option>الخامس الابتدائي</option>
<option>السادس الابتدائي</option>
</select>
</div>

<div>
<label class="block font-semibold mb-1">الشعب المستهدفة:</label>
<div class="flex flex-wrap gap-4 p-3 border rounded-lg bg-pink-50/50">
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="teacherSection" value="أ" class="w-4 h-4 text-pink-600 rounded"> الشعبة (أ)</label>
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="teacherSection" value="ب" class="w-4 h-4 text-pink-600 rounded"> الشعبة (ب)</label>
<label class="flex items-center gap-2 cursor-pointer font-medium"><input type="checkbox" name="teacherSection" value="ج" class="w-4 h-4 text-pink-600 rounded"> الشعبة (ج)</label>
</div>
</div>

<div>
<label class="block font-semibold mb-1">تفاصيل الدرس أو الواجب:</label>
<textarea id="teacherLessonContent" rows="3" class="w-full border rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-pink-500" placeholder="اكتبي تفاصيل الدرس..."></textarea>
</div>

<button id="teacherPublishBtn" onclick="teacherSendLesson()" class="w-full bg-pink-600 text-white py-3 rounded-xl font-bold text-xs hover:bg-pink-700 transition cursor-pointer shadow-sm">
نشر الدرس للشعب المحددة 🚀
</button>
</div>
</div>

</div>

<script>
const firebaseConfig = {
apiKey:"AIzaSyA4IukTwvEFVhmgxgxKI43ch_48kwXt0",
authDomain:"aldiyaaschool-af7e1.firebaseapp.com",
databaseURL:"https://aldiyaaschool-af7e1-default-rtdb.firebaseio.com",
projectId:"aldiyaaschool-af7e1",
storageBucket:"aldiyaaschool-af7e1.firebasestorage.app",
messagingSenderId:"322321446203",
appId:"1:322321446203:web:6bfbfc082076982e68b31e",
measurementId:"G-2GW91EKFN0"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const ROOT='school_data';

const adminPass='admin2026';
const teacherPass='teacher2026';

let userRole=localStorage.getItem('school_user_role');

window.onload=function(){
if(userRole==='admin'){
document.getElementById('authView').classList.add('hidden');
document.getElementById('adminDashboardView').classList.remove('hidden');
}else if(userRole==='teacher'){
document.getElementById('authView').classList.add('hidden');
document.getElementById('teacherDashboardView').classList.remove('hidden');
}
};

function loginUser(){
const p=document.getElementById('passInput').value.trim();
if(p===adminPass){
userRole='admin';
localStorage.setItem('school_user_role','admin');
document.getElementById('authView').classList.add('hidden');
document.getElementById('adminDashboardView').classList.remove('hidden');
document.getElementById('loginError').textContent='';
}else if(p===teacherPass){
userRole='teacher';
localStorage.setItem('school_user_role','teacher');
document.getElementById('authView').classList.add('hidden');
document.getElementById('teacherDashboardView').classList.remove('hidden');
document.getElementById('loginError').textContent='';
}else{
document.getElementById('loginError').textContent='❌ كلمة المرور غير صحيحة';
}
}

function logoutUser(){
userRole=null;
localStorage.removeItem('school_user_role');
document.getElementById('adminDashboardView').classList.add('hidden');
document.getElementById('teacherDashboardView').classList.add('hidden');
document.getElementById('authView').classList.remove('hidden');
document.getElementById('passInput').value='';
}

async function adminSendLesson(){
const subject=document.getElementById('adminLessonSubject').value;
const grade=document.getElementById('adminLessonGrade').value;
const content=document.getElementById('adminLessonContent').value.trim();
const checkedSections=Array.from(document.querySelectorAll('input[name="adminSection"]:checked')).map(cb=>cb.value);

if(!content){alert('يرجى كتابة التفاصيل أولاً.');return;}
if(checkedSections.length===0){alert('يرجى اختيار شعبة واحدة على الأقل.');return;}

const btn=document.getElementById('adminPublishBtn');
btn.disabled=true;
btn.textContent='جارٍ النشر...';

try{
const scheduleRef=db.ref(ROOT+'/schoolSchedule');
await scheduleRef.transaction(current=>{
const scheduleData=(current&&typeof current==='object')?{...current}:{};
checkedSections.forEach(section=>{
const classKey=grade+'_'+section;
if(!scheduleData[classKey]||typeof scheduleData[classKey]!=='object'){scheduleData[classKey]={};}
scheduleData[classKey][subject]=content;
});
return scheduleData;
},undefined,false);

document.getElementById('adminLessonContent').value='';
document.querySelectorAll('input[name="adminSection"]').forEach(cb=>cb.checked=false);
alert(`✓ تم النشر بنجاح لشعب (${checkedSections.join(', ')})`);
}catch(error){
alert('⚠️ خطأ: '+error.message);
}finally{
btn.disabled=false;
btn.textContent='نشر الدرس للشعب المحددة 🚀';
}
}

async function teacherSendLesson(){
const subject=document.getElementById('teacherLessonSubject').value;
const grade=document.getElementById('teacherLessonGrade').value;
const content=document.getElementById('teacherLessonContent').value.trim();
const checkedSections=Array.from(document.querySelectorAll('input[name="teacherSection"]:checked')).map(cb=>cb.value);

if(!content){alert('يرجى كتابة تفاصيل الدرس أولاً.');return;}
if(checkedSections.length===0){alert('يرجى اختيار شعبة واحدة على الأقل.');return;}

const btn=document.getElementById('teacherPublishBtn');
btn.disabled=true;
btn.textContent='جارٍ النشر...';

try{
const scheduleRef=db.ref(ROOT+'/schoolSchedule');
await scheduleRef.transaction(current=>{
const scheduleData=(current&&typeof current==='object')?{...current}:{};
checkedSections.forEach(section=>{
const classKey=grade+'_'+section;
if(!scheduleData[classKey]||typeof scheduleData[classKey]!=='object'){scheduleData[classKey]={};}
scheduleData[classKey][subject]=content;
});
return scheduleData;
},undefined,false);

document.getElementById('teacherLessonContent').value='';
document.querySelectorAll('input[name="teacherSection"]').forEach(cb=>cb.checked=false);
alert(`✓ تم نشر الدرس بنجاح لشعب (${checkedSections.join(', ')})`);
}catch(error){
alert('⚠️ خطأ: '+error.message);
}finally{
btn.disabled=false;
btn.textContent='نشر الدرس للشعب المحددة 🚀';
}
}
</script>
</body>
</html>
