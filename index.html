
<script>
const firebaseConfig = {
    apiKey: "AIzaSyA4IukTwvEFVhmgxgxKI43ch_48kwXt0nI",
    authDomain: "aldiyaaschool-af7e1.firebaseapp.com",
    databaseURL: "https://aldiyaaschool-af7e1-default-rtdb.firebaseio.com",
    projectId: "aldiyaaschool-af7e1",
    storageBucket: "aldiyaaschool-af7e1.firebasestorage.app",
    messagingSenderId: "322321446203",
    appId: "1:322321446203:web:6bfbfc082076982e68b31e",
    measurementId: "G-2GW91EKFN0"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const db = firebase.database();

const SESSION_IDS_KEY = 'school_parent_student_ids';
const ACTIVE_ID_KEY = 'school_parent_active_id';
const IMAGE_KEY_PREFIX = 'school_parent_image_';

let parentSessionIds = [];
let currentActiveStudentId = null;

try {
    parentSessionIds = JSON.parse(
        localStorage.getItem(SESSION_IDS_KEY) || '[]'
    );
    if (!Array.isArray(parentSessionIds)) parentSessionIds = [];
} catch (e) {
    parentSessionIds = [];
}

currentActiveStudentId = localStorage.getItem(ACTIVE_ID_KEY);

let globalSchoolData = {};
let base64Images = {1: '', 2: '', 3: ''};

let schoolDataLoaded = false;
let isOnline = false;
let isSubmittingRequests = false;
let isSendingInquiry = false;

// --------------------------------------------------
// رسائل الحالة
// --------------------------------------------------

function showStatus(message, type = 'info') {
    const box = document.getElementById('firebaseStatus');

    const styles = {
        info: 'bg-blue-50 text-blue-700 border border-blue-200',
        success: 'bg-green-50 text-green-700 border border-green-200',
        error: 'bg-red-50 text-red-700 border border-red-200',
        warning: 'bg-yellow-50 text-yellow-700 border border-yellow-200'
    };

    box.className =
        'p-3 rounded-lg text-xs text-center font-bold ' +
        (styles[type] || styles.info);

    box.textContent = message;
}

// --------------------------------------------------
// مراقبة الاتصال
// --------------------------------------------------

db.ref('.info/connected').on('value', snapshot => {
    isOnline = snapshot.val() === true;

    showStatus(
        isOnline
            ? 'متصل بقاعدة بيانات المدرسة ✓'
            : 'الاتصال بالسحابة غير متوفر حالياً',
        isOnline ? 'success' : 'warning'
    );

    if (isOnline && schoolDataLoaded && parentSessionIds.length) {
        checkAndSyncSession();
    }
});

// --------------------------------------------------
// تحميل بيانات المدرسة
// --------------------------------------------------

window.addEventListener('load', () => {
    // إظهار شاشة الدخول مؤقتاً إلى أن تصل بيانات Firebase
    document.getElementById('parentLoginView').classList.remove('hidden');
    document.getElementById('parentWaitingView').classList.add('hidden');
    document.getElementById('parentDashboardView').classList.add('hidden');

    db.ref('school_data').on(
        'value',
        snapshot => {
            globalSchoolData = snapshot.val() || {};
            schoolDataLoaded = true;

            // استعادة الجلسة المحفوظة تلقائياً
            if (parentSessionIds.length > 0) {
                checkAndSyncSession();
            }
        },
        error => {
            console.error('Firebase read error:', error);
            showStatus(
                'تعذر تحميل بيانات المدرسة. تحقق من الاتصال والصلاحيات.',
                'error'
            );
        }
    );
});

// --------------------------------------------------
// الصور: معاينة وحفظ محلي فقط
// --------------------------------------------------

function previewStudentImage(event, index) {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
        alert('يرجى اختيار صورة صحيحة.');
        event.target.value = '';
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert('حجم الصورة يجب أن يكون أقل من 5 ميغابايت.');
        event.target.value = '';
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        base64Images[index] = e.target.result;

        document.getElementById(`studentImagePreview_${index}`).src =
            e.target.result;

        document.getElementById(`imagePreviewContainer_${index}`)
            .classList.remove('hidden');
    };

    reader.onerror = () => alert('تعذرت قراءة الصورة.');

    reader.readAsDataURL(file);
}

// تصغير الصورة لتقليل مساحة التخزين على الجهاز
function compressImageLocally(dataUrl) {
    return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxSize = 240;

            let width = img.width;
            let height = img.height;

            if (width > height && width > maxSize) {
                height = Math.round(height * maxSize / width);
                width = maxSize;
            } else if (height > maxSize) {
                width = Math.round(width * maxSize / height);
                height = maxSize;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', 0.65));
        };

        img.onerror = reject;
        img.src = dataUrl;
    });
}

async function saveStudentImageLocally(studentId, dataUrl) {
    if (!dataUrl) return;

    try {
        const smallImage = await compressImageLocally(dataUrl);

        // الصورة تحفظ في جهاز ولي الأمر فقط ولا ترسل إلى Firebase
        localStorage.setItem(
            IMAGE_KEY_PREFIX + studentId,
            smallImage
        );
    } catch (error) {
        console.warn('تعذر حفظ الصورة محلياً:', error);
    }
}

function getStudentLocalImage(studentId) {
    try {
        return localStorage.getItem(IMAGE_KEY_PREFIX + studentId) || '';
    } catch (error) {
        return '';
    }
}

// --------------------------------------------------
// أدوات مساعدة
// --------------------------------------------------

function normalizeName(value) {
    return String(value || '')
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
}

function asList(value) {
    if (Array.isArray(value)) return value;

    if (value && typeof value === 'object') {
        return Object.values(value);
    }

    return [];
}

function saveParentSession(ids, activeId) {
    parentSessionIds = [...new Set(ids.filter(Boolean))];
    currentActiveStudentId = activeId || parentSessionIds[0] || null;

    localStorage.setItem(
        SESSION_IDS_KEY,
        JSON.stringify(parentSessionIds)
    );

    if (currentActiveStudentId) {
        localStorage.setItem(ACTIVE_ID_KEY, currentActiveStudentId);
    }
}

// --------------------------------------------------
// إرسال طلبات التسجيل
// --------------------------------------------------

async function submitAllStudentsRequests() {
    if (isSubmittingRequests) return;

    if (!schoolDataLoaded || !isOnline) {
        alert('يرجى الانتظار حتى يتم الاتصال بقاعدة بيانات المدرسة.');
        return;
    }

    const newRequests = [];
    const newIds = [];
    const formNames = new Set();

    for (let i = 1; i <= 3; i++) {
        const student = document
            .getElementById(`parentStudentName_${i}`).value.trim();

        const mother = document
            .getElementById(`parentMotherName_${i}`).value.trim();

        const grade = document
            .getElementById(`parentGrade_${i}`).value;

        const section = document
            .getElementById(`parentSection_${i}`).value;

        if (!student && !mother) continue;

        if (!student || !mother) {
            alert(
                `يرجى إكمال بيانات الطالبة رقم (${i}) أو ترك الحقول فارغة.`
            );
            return;
        }

        const normalized = normalizeName(student);

        if (formNames.has(normalized)) {
            alert(`الاسم (${student}) مكرر في الطلب نفسه.`);
            return;
        }

        formNames.add(normalized);

        const key = db.ref('school_data/pendingRequests').push().key;
        const studentId = 'st_' + key;

        newIds.push(studentId);

        // لا نرسل الصورة إلى قاعدة البيانات
        newRequests.push({
            id: studentId,
            student,
            mother,
            grade,
            section
        });
    }

    if (!newRequests.length) {
        alert('يرجى إدخال بيانات طالبة واحدة على الأقل.');
        return;
    }

    isSubmittingRequests = true;

    const submitButton = document.getElementById('submitRequestsButton');
    submitButton.disabled = true;
    submitButton.textContent = 'جارٍ حفظ الطلبات...';

    try {
        // التأكد من عدم وجود الطالبة ضمن المقبولات
        const approvedSnapshot = await db
            .ref('school_data/approvedStudents')
            .once('value');

        const approvedNames = new Set(
            asList(approvedSnapshot.val())
                .map(s => normalizeName(s.student))
        );

        for (const request of newRequests) {
            if (approvedNames.has(normalizeName(request.student))) {
                throw new Error(
                    `الطالبة (${request.student}) مسجلة مسبقاً ضمن الطالبات المقبولات.`
                );
            }
        }

        let duplicateName = '';

        // تحديث قائمة الطلبات فقط دون استبدال جذر قاعدة البيانات
        const result = await db
            .ref('school_data/pendingRequests')
            .transaction(currentData => {
                const pending = asList(currentData);

                const pendingNames = new Set(
                    pending.map(s => normalizeName(s.student))
                );

                for (const request of newRequests) {
                    if (pendingNames.has(normalizeName(request.student))) {
                        duplicateName = request.student;
                        return;
                    }
                }

                return [...pending, ...newRequests];
            });

        if (!result.committed) {
            throw new Error(
                duplicateName
                    ? `الطالبة (${duplicateName}) موجودة في الطلبات المعلقة.`
                    : 'لم يتم اعتماد عملية الحفظ.'
            );
        }

        // حفظ الصور على جهاز ولي الأمر فقط
        for (let i = 0; i < newRequests.length; i++) {
            const formIndex = findFormIndexForStudent(
                newRequests[i].student
            );

            if (formIndex && base64Images[formIndex]) {
                await saveStudentImageLocally(
                    newRequests[i].id,
                    base64Images[formIndex]
                );
            }
        }

        // حفظ جلسة ولي الأمر حتى بعد إغلاق الصفحة
        saveParentSession(newIds, newIds[0]);

        showWaitingScreen();

        showStatus('تم حفظ الطلبات بنجاح ✓', 'success');

        alert(
            `تم إرسال طلبات (${newRequests.length}) طالبة بنجاح إلى الإدارة.`
        );

    } catch (error) {
        console.error(error);

        showStatus('لم يكتمل الحفظ. يرجى المحاولة مجدداً.', 'error');

        alert(error.message || 'حدث خطأ أثناء حفظ الطلبات.');

    } finally {
        isSubmittingRequests = false;
        submitButton.disabled = false;
        submitButton.textContent = 'إرسال كافة الطلبات للإدارة 🚀';
    }
}

function findFormIndexForStudent(studentName) {
    for (let i = 1; i <= 3; i++) {
        const input = document.getElementById(`parentStudentName_${i}`);

        if (input && input.value.trim() === studentName) {
            return i;
        }
    }

    return null;
}

// --------------------------------------------------
// استعادة جلسة ولي الأمر ومزامنتها
// --------------------------------------------------

function checkAndSyncSession() {
    if (!schoolDataLoaded || !parentSessionIds.length) return;

    const approved = asList(globalSchoolData.approvedStudents);
    const pending = asList(globalSchoolData.pendingRequests);

    const approvedSiblings = parentSessionIds
        .map(id => approved.find(s => s && s.id === id))
        .filter(Boolean);

    const pendingSiblings = parentSessionIds
        .map(id => pending.find(s => s && s.id === id))
        .filter(Boolean);

    // إذا وافقت الإدارة على طالبة واحدة أو أكثر
    if (approvedSiblings.length > 0) {
        if (!approvedSiblings.some(
            s => s.id === currentActiveStudentId
        )) {
            currentActiveStudentId = approvedSiblings[0].id;

            localStorage.setItem(
                ACTIVE_ID_KEY,
                currentActiveStudentId
            );
        }

        const activeStudent =
            approvedSiblings.find(
                s => s.id === currentActiveStudentId
            ) || approvedSiblings[0];

        showDashboard(activeStudent, approvedSiblings);
        renderParentContent(activeStudent);

        return;
    }

    // إذا كانت الطلبات لا تزال قيد المراجعة
    if (pendingSiblings.length > 0) {
        showWaitingScreen();
        return;
    }

    // لا نمسح الجلسة تلقائياً عند عدم العثور على البيانات
    // فقد تكون البيانات لم تكتمل بعد أو الاتصال غير مستقر
    if (!isOnline) {
        showStatus(
            'تعذر التحقق من حالة الحساب حالياً. ستبقى الجلسة محفوظة.',
            'warning'
        );
        return;
    }

    // إذا لم يعد الطلب موجوداً في القائمتين، نعرض شاشة الدخول
    // مع إبقاء بيانات الجلسة المحلية وعدم حذفها تلقائياً
    document.getElementById('parentDashboardView').classList.add('hidden');
    document.getElementById('parentWaitingView').classList.add('hidden');
    document.getElementById('parentLoginView').classList.remove('hidden');

    showStatus(
        'لم يتم العثور على طلب مرتبط بهذه الجلسة. يرجى مراجعة الإدارة.',
        'warning'
    );
}

// --------------------------------------------------
// تحديث حالة الطلب يدوياً
// --------------------------------------------------

async function checkApprovalStatusAgain() {
    if (!isOnline) {
        alert('تحقق من الاتصال بالإنترنت أولاً.');
        return;
    }

    try {
        const snapshot = await db.ref('school_data').once('value');

        globalSchoolData = snapshot.val() || {};
        schoolDataLoaded = true;

        checkAndSyncSession();

        alert('تم تحديث حالة الطلبات من قاعدة البيانات.');

    } catch (error) {
        console.error(error);
        alert('تعذر تحديث الحالة. تحقق من الإنترنت.');
    }
}

// --------------------------------------------------
// عرض الشاشات
// --------------------------------------------------

function showWaitingScreen() {
    document.getElementById('parentLoginView').classList.add('hidden');
    document.getElementById('parentWaitingView').classList.remove('hidden');
    document.getElementById('parentDashboardView').classList.add('hidden');
}

function showDashboard(student, siblings) {
    document.getElementById('parentLoginView').classList.add('hidden');
    document.getElementById('parentWaitingView').classList.add('hidden');
    document.getElementById('parentDashboardView').classList.remove('hidden');

    document.getElementById('welcomeStudentTitle').textContent =
        `👧 الطالبة الحالية: ${student.student}`;

    document.getElementById('studentClassInfo').textContent =
        `${student.grade} - الشعبة (${student.section}) | ولي الأمر: ${student.mother}`;

    const imgContainer =
        document.getElementById('dashboardImageContainer');

    imgContainer.replaceChildren();

    const localImage = getStudentLocalImage(student.id);

    if (localImage) {
        const img = document.createElement('img');
        img.src = localImage;
        img.alt = 'صورة الطالبة';
        img.className =
            'w-12 h-12 rounded-full object-cover border-2 border-pink-600 shadow-sm';

        imgContainer.appendChild(img);
    } else {
        const fallback = document.createElement('div');

        fallback.className =
            'w-12 h-12 rounded-full bg-pink-100 flex items-center justify-center text-pink-700 font-bold text-base';

        fallback.textContent = '👧';

        imgContainer.appendChild(fallback);
    }

    const listDiv =
        document.getElementById('siblingsButtonsList');

    listDiv.innerHTML = '';

    siblings.forEach(sib => {
        const button = document.createElement('button');

        button.type = 'button';
        button.textContent = '👧 ' + sib.student;

        button.className =
            'px-3 py-1.5 rounded-lg text-xs transition cursor-pointer flex items-center gap-1.5 ' +
            (sib.id === student.id
                ? 'bg-pink-600 text-white font-bold shadow'
                : 'bg-pink-100 text-pink-800 hover:bg-pink-200');

        button.onclick = () => switchActiveSibling(sib.id);

        listDiv.appendChild(button);
    });
}

// --------------------------------------------------
// التنقل بين الطالبات
// --------------------------------------------------

function switchActiveSibling(id) {
    if (!id) return;

    currentActiveStudentId = id;

    localStorage.setItem(ACTIVE_ID_KEY, id);

    checkAndSyncSession();
}

// --------------------------------------------------
// الإشعارات والجدول
// --------------------------------------------------

function renderParentContent(student) {
    const notifContainer =
        document.getElementById('parentNotificationsContainer');

    const notifications = asList(student.notifications);

    notifContainer.innerHTML = '';

    if (!notifications.length) {
        notifContainer.textContent = 'لا توجد إشعارات جديدة حالياً.';
    } else {
        notifications.forEach(n => {
            const card = document.createElement('div');

            card.className =
                'bg-indigo-50 border border-indigo-100 p-2 rounded-lg';

            const title = document.createElement('p');
            title.className = 'font-bold text-indigo-900';
            title.textContent = n.title || '';

            const body = document.createElement('p');
            body.className = 'text-gray-700 mt-0.5';
            body.textContent = n.body || '';

            card.append(title, body);
            notifContainer.appendChild(card);
        });
    }

    const scheduleContainer =
        document.getElementById('parentScheduleContainer');

    const classKey = `${student.grade}_${student.section}`;

    const schedule =
        (globalSchoolData.schoolSchedule &&
         globalSchoolData.schoolSchedule[classKey]) || {};

    scheduleContainer.innerHTML = '';

    if (!Object.keys(schedule).length) {
        scheduleContainer.textContent =
            'لا توجد دروس منشورة لهذا الصف والشعبة حالياً.';
    } else {
        for (const [subject, content] of Object.entries(schedule)) {
            const card = document.createElement('div');

            card.className =
                'bg-pink-50 border border-pink-100 p-2 rounded-lg';

            const title = document.createElement('p');
            title.className = 'font-bold text-pink-800';
            title.textContent = '📖 ' + subject + ':';

            const body = document.createElement('p');
            body.className = 'text-gray-700 mt-0.5';
            body.textContent = content || '';

            card.append(title, body);
            scheduleContainer.appendChild(card);
        }
    }
}

// --------------------------------------------------
// إرسال استفسار للإدارة
// --------------------------------------------------

async function sendParentInquiry() {
    if (isSendingInquiry) return;

    if (!schoolDataLoaded || !isOnline) {
        alert('تحقق من الاتصال بقاعدة البيانات قبل إرسال الاستفسار.');
        return;
    }

    const textarea =
        document.getElementById('parentInquiryText');

    const content = textarea.value.trim();

    if (!content) {
        alert('يرجى كتابة الاستفسار أولاً.');
        return;
    }

    const approved = asList(globalSchoolData.approvedStudents);

    const student = approved.find(
        s => s && s.id === currentActiveStudentId
    );

    if (!student) {
        alert('لم يتم العثور على بيانات الطالبة الحالية.');
        return;
    }

    const inquiryRef = db.ref('school_data/parentInquiries');

    const inquiry = {
        id: inquiryRef.push().key,
        studentId: student.id,
        studentName: student.student,
        grade: student.grade,
        section: student.section,
        content,
        createdAt: Date.now()
    };

    isSendingInquiry = true;

    try {
        const result = await inquiryRef.transaction(currentData => {
            const inquiries = asList(currentData);

            return [...inquiries, inquiry];
        });

        if (!result.committed) {
            throw new Error('لم يتم اعتماد حفظ الاستفسار.');
        }

        textarea.value = '';

        showStatus(
            'تم حفظ الاستفسار وإرساله للإدارة ✓',
            'success'
        );

        alert('تم إرسال استفسارك للإدارة بنجاح.');

    } catch (error) {
        console.error(error);

        showStatus('تعذر حفظ الاستفسار.', 'error');

        alert('لم يتم إرسال الاستفسار. يرجى المحاولة مجدداً.');

    } finally {
        isSendingInquiry = false;
    }
}

// --------------------------------------------------
// تسجيل الخروج اليدوي فقط
// --------------------------------------------------

function logoutParent() {
    const confirmed = confirm(
        'هل تريد تسجيل الخروج من بوابة ولي الأمر على هذا الجهاز؟'
    );

    if (!confirmed) return;

    localStorage.removeItem(SESSION_IDS_KEY);
    localStorage.removeItem(ACTIVE_ID_KEY);

    parentSessionIds = [];
    currentActiveStudentId = null;

    document.getElementById('parentDashboardView').classList.add('hidden');
    document.getElementById('parentWaitingView').classList.add('hidden');
    document.getElementById('parentLoginView').classList.remove('hidden');

    showStatus('تم تسجيل الخروج من البوابة.', 'info');
}
</script>
