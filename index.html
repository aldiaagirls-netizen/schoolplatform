<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة المدرسية المتكاملة - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex items-center justify-center min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-600 mb-2">تسجيل دخول المنصة</h1>
            <p class="text-sm text-gray-500">أدخل بيانات الحساب الخاصة بك للوصول إلى البوابة</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">اسم المستخدم أو البريد:</label>
                <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="أدخل اسم المستخدم">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">كلمة المرور:</label>
                <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            </div>
            <div id="errorMessage" class="text-red-500 text-sm hidden text-center">خطأ في اسم المستخدم أو كلمة المرور!</div>
            <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">دخول للنظام</button>
        </div>
    </div>

    <!-- لوحة المنصة المحمية (تظهر بعد الدخول الناجح) -->
    <div id="dashboardScreen" class="hidden w-full min-h-screen bg-gray-50 p-6">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
                <h1 class="text-xl font-bold text-blue-600" id="welcomeTitle">لوحة التحكم</h1>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">تسجيل الخروج</button>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm text-center">
                <h2 class="text-2xl font-bold mb-4">مرحباً بك في المنصة المدرسية المتكاملة</h2>
                <p class="text-gray-600">تم تسجيل دخولك بنجاح بناءً على صلاحيات الحساب الخاص بك.</p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const error = document.getElementById('errorMessage');

            // بيانات تجريبية للصلاحيات (يمكنك تعديلها لاحقاً)
            if ((user === "admin" && pass === "1234") || 
                (user === "teacher" && pass === "1234") || 
                (user === "parent" && pass === "1234") || 
                (user === "student" && pass === "1234")) {
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                error.classList.add('hidden');
            } else {
                error.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
